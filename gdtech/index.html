<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <script>try{if(localStorage.getItem("gd.session")||sessionStorage.getItem("gd.session"))location.replace("/home.html")}catch(e){}</script>
  <script>try{var q=new URLSearchParams(location.search).get("perf"),t=(q==="low"||q==="mid"||q==="high")?q:sessionStorage.getItem("gd.perf");if(!t){var c=navigator.connection,r=navigator.deviceMemory,k=navigator.hardwareConcurrency,m=matchMedia("(prefers-reduced-motion:reduce)").matches;t=(m||(c&&(c.saveData||c.effectiveType==="slow-2g"||c.effectiveType==="2g"))||(r!=null&&r<=2)||(k!=null&&k<=2))?"low":((r!=null&&r<=4)||(k!=null&&k<=4)||(c&&c.effectiveType==="3g"))?"mid":"high"}document.documentElement.classList.add("perf-"+t);document.documentElement.dataset.perf=t}catch(e){}</script>
  <title>GDTech | Genuine phones, laptops and gadgets</title>
  <meta name="description" content="Shop genuine phones, laptops, headsets, tablets and smart gadgets at honest prices with fast delivery. Trade in your old phone and upgrade with GDTech." />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="GDTech" />
  <meta property="og:title" content="GDTech | Genuine phones, laptops and gadgets" />
  <meta property="og:description" content="Shop genuine phones, laptops, headsets, tablets and smart gadgets at honest prices with fast delivery. Trade in your old phone and upgrade with GDTech." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="GDTech | Genuine phones, laptops and gadgets" />
  <meta name="twitter:description" content="Shop genuine phones, laptops, headsets, tablets and smart gadgets at honest prices with fast delivery. Trade in your old phone and upgrade with GDTech." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Store","name":"GDTech","description":"Genuine phones, laptops, headsets, tablets and smart gadgets at honest prices with fast delivery.","areaServed":"NG","priceRange":"$$"}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" /></noscript>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="logo-mark" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="14" fill="#FF7A1A" />
      <rect x="15" y="9" width="18" height="30" rx="5" fill="none" stroke="#fff" stroke-width="3" />
      <circle cx="24" cy="33" r="1.8" fill="#fff" />
      <rect x="21" y="13" width="6" height="2.4" rx="1.2" fill="#0B0B0C" />
    </symbol>
  </svg>

  <div id="desktop-note">
    <svg class="mark"><use href="#logo-mark" /></svg>
    <h2>View on mobile</h2>
    <p>GDTech is built for your phone. Open this link on your mobile device.</p>
  </div>

  <main id="app">
    <!-- Splash -->
    <section class="screen splash active" id="splash">
      <div class="glow"></div>
      <div class="brand">
        <svg class="mark big"><use href="#logo-mark" /></svg>
        <h1>GD<span>TECH</span></h1>
      </div>
      <div class="loader"><i></i></div>
    </section>

    <!-- Onboarding -->
    <section class="screen onboarding" id="onboarding">
      <div class="media">
        <div class="fallback"></div>
        <video id="ob-video" data-src="/onboarding.mp4" data-poster="/onboarding-poster.webp" muted loop playsinline preload="none"></video>
        <div class="fade"></div>
        <button class="skip" id="skip">Skip</button>
      </div>

      <div class="panel">
        <div class="brand small">
          <svg class="mark"><use href="#logo-mark" /></svg>
          <h1>GD<span>TECH</span></h1>
        </div>

        <div class="copy">
          <h2 id="ob-title"></h2>
          <p id="ob-text"></p>
        </div>

        <div class="controls">
          <div class="dots" id="dots"></div>
          <div class="btns">
            <button class="btn ghost" id="back">Back</button>
            <button class="btn solid" id="next">Continue</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Auth -->
    <section class="screen auth" id="auth">
      <div class="top">
        <img class="hero" data-src="/phones/hero.webp" width="670" height="1000" alt="Latest smartphones" decoding="async" />
        <svg class="edge" viewBox="0 0 1200 60" preserveAspectRatio="none">
          <path d="M0 30 Q150 0 300 30 T600 30 T900 30 T1200 30 V0 H0 Z" fill="#fff" />
        </svg>
      </div>

      <div class="card glass">
        <div class="tabs">
          <i class="pill"></i>
          <button class="tab on" data-t="in" type="button">Sign in</button>
          <button class="tab" data-t="up" type="button">Sign up</button>
        </div>
        <form id="auth-form" novalidate>
          <label class="f up-only"><input id="a-name" type="text" placeholder="Full name" autocomplete="name" /></label>
          <label class="f in-only"><input id="a-id" type="text" placeholder="Email or phone number" autocomplete="username" /></label>
          <label class="f up-only"><input id="a-email" type="email" placeholder="Email address" autocomplete="email" /></label>
          <label class="f up-only"><input id="a-phone" type="tel" placeholder="Phone number" autocomplete="tel" /></label>
          <label class="f pw">
            <input id="a-pw" type="password" placeholder="Password" autocomplete="current-password" />
            <button class="eye" type="button">Show</button>
          </label>
          <label class="f pw up-only">
            <input id="a-pw2" type="password" placeholder="Confirm password" autocomplete="new-password" />
            <button class="eye" type="button">Show</button>
          </label>
          <div class="row in-only">
            <label class="chk"><input id="a-remember" type="checkbox" checked /> Remember me</label>
            <button class="link" type="button">Forgot password?</button>
          </div>
          <label class="chk up-only"><input id="a-agree" type="checkbox" /> I agree to the Terms and Privacy Policy</label>
          <p class="auth-err" id="auth-err" role="alert" hidden></p>
          <button class="btn dark" type="submit" id="auth-btn"><span class="lbl">Sign in</span><i class="spin" aria-hidden="true"></i></button>
        </form>
        <div class="or"><span>or</span></div>
        <button class="btn outline" id="google" type="button"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.5 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 0 1 0-4.8V6.5H1.4a12 12 0 0 0 0 10.9l4-3z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C18 1.2 15.2 0 12 0 7.4 0 3.4 2.5 1.4 6.5l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg>Continue with Google</button>
      </div>
    </section>

    <!-- Incoming call intro -->
    <section class="call" id="call" aria-hidden="true">
      <div class="stage">
        <i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i>
        <svg class="mark phone"><use href="#logo-mark" /></svg>
      </div>
    </section>

    <div id="wave"><div class="fill"></div></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
