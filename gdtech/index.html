<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>GDTech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="logo-mark" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="14" fill="#FF7A1A" />
      <rect x="15" y="9" width="18" height="30" rx="5" fill="none" stroke="#fff" stroke-width="3" />
      <circle cx="24" cy="33" r="1.8" fill="#fff" />
      <rect x="21" y="13" width="6" height="2.4" rx="1.2" fill="#0B0B0C" />
    </symbol>
  </svg>

  <div id="desktop-note">
    <svg class="mark"><use href="#logo-mark" /></svg>
    <h2>View on mobile</h2>
    <p>GDTech is built for your phone. Open this link on your mobile device.</p>
  </div>

  <main id="app">
    <!-- Splash -->
    <section class="screen splash active" id="splash">
      <div class="glow"></div>
      <div class="brand">
        <svg class="mark big"><use href="#logo-mark" /></svg>
        <h1>GD<span>TECH</span></h1>
      </div>
      <div class="loader"><i></i></div>
    </section>

    <!-- Onboarding -->
    <section class="screen onboarding" id="onboarding">
      <div class="media">
        <div class="fallback"></div>
        <video id="ob-video" src="/onboarding.mp4" autoplay muted loop playsinline></video>
        <div class="fade"></div>
        <button class="skip" id="skip">Skip</button>
      </div>

      <div class="panel">
        <div class="brand small">
          <svg class="mark"><use href="#logo-mark" /></svg>
          <h1>GD<span>TECH</span></h1>
        </div>

        <div class="copy">
          <h2 id="ob-title"></h2>
          <p id="ob-text"></p>
        </div>

        <div class="controls">
          <div class="dots" id="dots"></div>
          <div class="btns">
            <button class="btn ghost" id="back">Back</button>
            <button class="btn solid" id="next">Continue</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Auth -->
    <section class="screen auth" id="auth">
      <div class="top">
        <div class="ph a"><div class="scr"><img src="/phones/1.png" alt="" onerror="this.remove()" /></div></div>
        <div class="ph c"><div class="scr"><img src="/phones/3.png" alt="" onerror="this.remove()" /></div></div>
        <div class="ph b"><div class="scr"><img src="/phones/2.png" alt="" onerror="this.remove()" /></div></div>
        <svg class="edge" viewBox="0 0 1200 60" preserveAspectRatio="none">
          <path d="M0 30 Q150 0 300 30 T600 30 T900 30 T1200 30 V0 H0 Z" fill="#fff" />
        </svg>
      </div>

      <div class="card">
        <div class="tabs">
          <i class="pill"></i>
          <button class="tab on" data-t="in" type="button">Sign in</button>
          <button class="tab" data-t="up" type="button">Sign up</button>
        </div>
        <form id="auth-form">
          <label class="f name"><input type="text" placeholder="Full name" /></label>
          <label class="f"><input type="email" placeholder="Email address" required /></label>
          <label class="f"><input type="password" placeholder="Password" required /></label>
          <button class="btn dark" type="submit" id="auth-btn">Sign in</button>
        </form>
        <button class="guest" id="guest" type="button">Continue as guest</button>
      </div>
    </section>

    <!-- Welcome -->
    <section class="screen welcome" id="welcome">
      <h2>Welcome</h2>
    </section>
        <div id="wave"><div class="fill"></div></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
