<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>GDTech</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="logo-mark" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="14" fill="#FF7A1A" />
      <rect x="15" y="9" width="18" height="30" rx="5" fill="none" stroke="#fff" stroke-width="3" />
      <circle cx="24" cy="33" r="1.8" fill="#fff" />
      <rect x="21" y="13" width="6" height="2.4" rx="1.2" fill="#0B0B0C" />
    </symbol>
  </svg>

  <div id="desktop-note">
    <svg class="mark"><use href="#logo-mark" /></svg>
    <h2>View on mobile</h2>
    <p>GDTech is built for your phone. Open this link on your mobile device.</p>
  </div>

  <main id="app">
    <section class="screen home active" id="home">
      <header class="h-top">
        <svg class="mark" aria-label="GDTech"><use href="#logo-mark" /></svg>
        <button class="bag" type="button" aria-label="Bag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
          <b></b>
        </button>
      </header>

      <div class="banners" id="b-track">
        <article class="b-card orange">
          <div class="b-text">
            <h3>GENUINE<br>PHONES</h3>
            <p>Latest iPhones</p>
          </div>
          <div class="b-img">
            <span class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M11 18.5h2"/></svg><em>Phone image</em></span>
            <img src="/phones/banner-1.png" alt="" onload="this.parentElement.classList.add('has')" onerror="this.remove()" />
          </div>
          <button class="b-btn" type="button">Details <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </article>
        <article class="b-card slate">
          <div class="b-text">
            <h3>REAL<br>PRICES</h3>
            <p>Clear promotion</p>
          </div>
          <div class="b-img">
            <span class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M11 18.5h2"/></svg><em>Phone image</em></span>
            <img src="/phones/banner-2.png" alt="" onload="this.parentElement.classList.add('has')" onerror="this.remove()" />
          </div>
          <button class="b-btn" type="button">Details <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </article>
        <article class="b-card cream">
          <div class="b-text">
            <h3>FAST<br>DELIVERY</h3>
            <p>Quick delivery</p>
          </div>
          <div class="b-img">
            <span class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M11 18.5h2"/></svg><em>Phone image</em></span>
            <img src="/phones/banner-3.png" alt="" onload="this.parentElement.classList.add('has')" onerror="this.remove()" />
          </div>
          <button class="b-btn" type="button">Details <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </article>
      </div>
      <div class="b-dots" id="b-dots"><i class="on"></i><i></i><i></i></div>

      <nav class="dock" id="dock" aria-label="Main">
        <button class="on" type="button" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
        <button type="button" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></button>
        <button type="button" aria-label="Favourites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-5-9.5-10A5 5 0 0 1 12 7.5 5 5 0 0 1 21.5 11C20 16 12 21 12 21z"/></svg></button>
        <button type="button" aria-label="Profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button>
      </nav>
    </section>

  </main>

  <script type="module" src="/src/home.js"></script>
</body>
</html>
